name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  # ── Build prebuilt binaries for Windows x64 ────────────────────────────────
  prebuilds-x64:
    name: Prebuilds — Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Build prebuilds (x64)
        run: npx prebuildify --napi --strip --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-win32-x64
          path: prebuilds/

  # ── Build prebuilt binaries for Windows arm64 (cross-compile) ─────────────
  prebuilds-arm64:
    name: Prebuilds — Windows arm64
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Build prebuilds (arm64 cross-compile)
        run: npx prebuildify --napi --strip --arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-win32-arm64
          path: prebuilds/

  # ── Publish to npm + create GitHub Release ────────────────────────────────
  publish:
    name: Publish to npm + GitHub Release
    needs: [prebuilds-x64, prebuilds-arm64]
    if: always() && needs.prebuilds-x64.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile TypeScript
        run: npm run build

      - name: Download prebuilds (x64)
        uses: actions/download-artifact@v4
        with:
          name: prebuilds-win32-x64
          path: prebuilds/

      - name: Download prebuilds (arm64)
        uses: actions/download-artifact@v4
        with:
          name: prebuilds-win32-arm64
          path: prebuilds/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: prebuilds/**/*.node

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

